spring.application.name=portfolio

# Bind to cloud provider PORT (Render, Railway, Heroku, etc.) or default to 8080
server.port=${PORT:8080}
server.address=0.0.0.0

# ===== Database Configuration =====
# Reads cloud environment variables if present, defaults to in-memory H2
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:h2:mem:portfolio_db;DB_CLOSE_DELAY=-1}
spring.datasource.driver-class-name=${SPRING_DATASOURCE_DRIVER:org.h2.Driver}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:sa}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

spring.jpa.hibernate.ddl-auto=${SPRING_JPA_HIBERNATE_DDL_AUTO:update}
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# ===== JWT =====
app.jwt.secret=${JWT_SECRET:ChangeThisSecretKeyToSomethingLongAndRandomForProductionUseAtLeast32Bytes}
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}

# ===== NVIDIA AI (NIM) =====
nvidia.api.key=${NVIDIA_API_KEY:nvapi-REPLACE_WITH_YOUR_KEY}
nvidia.api.url=https://integrate.api.nvidia.com/v1/chat/completions
nvidia.api.model=meta/llama-3.1-70b-instruct

# ===== Owner / Portfolio Info =====
portfolio.owner.name=MD Jamal
portfolio.owner.title=B.Tech IT Student and Web Developer
portfolio.owner.email=jamalalam652@gmail.com

