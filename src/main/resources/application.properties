spring.application.name=portfolio
server.port=8080

# ===== MySQL (production) =====
# Uncomment and configure for MySQL:
# spring.datasource.url=jdbc:mysql://localhost:3306/portfolio_db?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC
# spring.datasource.username=root
# spring.datasource.password=yourpassword
# spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
# spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect

# ===== H2 (default for quick start - works out of the box) =====
spring.datasource.url=jdbc:h2:mem:portfolio_db;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# ===== JWT =====
app.jwt.secret=ChangeThisSecretKeyToSomethingLongAndRandomForProductionUseAtLeast32Bytes
app.jwt.expiration-ms=86400000

# ===== NVIDIA AI (NIM) =====
# Get a free API key from https://build.nvidia.com/
nvidia.api.key=${NVIDIA_API_KEY:nvapi-REPLACE_WITH_YOUR_KEY}
nvidia.api.url=https://integrate.api.nvidia.com/v1/chat/completions
nvidia.api.model=meta/llama-3.1-70b-instruct

# ===== Owner / Portfolio Info (used by AI as context) =====
portfolio.owner.name=MD Jamal
portfolio.owner.title=B.Tech IT Student and Web Developer
portfolio.owner.email=jamalalam652@gmail.com
